name: CI - Pete-Eebot

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the known test dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Lint critical modules
        run: |
          python -m ruff check \
            pete_e/api.py \
            pete_e/api_errors.py \
            pete_e/api_security.py \
            pete_e/api_routes \
            pete_e/application/orchestrator.py \
            pete_e/application/plan_generation.py \
            pete_e/application/sync.py \
            pete_e/config/config.py \
            pete_e/infrastructure/postgres_dal.py \
            pete_e/logging_setup.py \
            tests/conftest.py \
            tests/config/test_settings.py \
            tests/integration/conftest.py \
            tests/integration/test_api_contracts.py \
            tests/integration/test_postgres_integration.py \
            tests/postgres_safety.py \
            tests/test_api_cli_commands.py \
            tests/test_dependency_imports.py \
            tests/test_installed_artifact.py \
            tests/test_postgres_safety.py \
            tests/test_tenacity_contract.py

      - name: Run unit lane
        run: python -m pytest -q -m unit

      - name: Run real-framework contract lane
        run: python -m pytest -q -m contract

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pete_e_test_ci
          POSTGRES_USER: pete_test
          POSTGRES_PASSWORD: pete_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pete_test -d pete_e_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the known test dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run disposable PostgreSQL lane
        env:
          PETEEEBOT_TEST_DATABASE_URL: postgresql://pete_test:pete_test@127.0.0.1:5432/pete_e_test_ci
        run: python -m pytest -q -m integration --run-postgres

  installed-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Build, install, and smoke the wheel outside the checkout
        run: python -m pytest -q -m artifact
