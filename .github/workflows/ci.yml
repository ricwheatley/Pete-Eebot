name: CI - Pete-Eebot

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Verify and install the locked dependency graph
        run: |
          uv lock --check
          uv sync --frozen --no-editable
          .venv/bin/python -m pip check

      - name: Audit the locked dependency graph
        run: .venv/bin/python -m pip_audit --local --skip-editable

      - name: Lint repository Python scope
        run: .venv/bin/ruff check pete_e tests scripts

      - name: Check tranche formatting scope
        run: >-
          .venv/bin/ruff format --check
          pete_e/domain/repositories.py
          pete_e/domain/body_age_history.py
          pete_e/domain/body_age_trend.py
          pete_e/domain/weekly_narrative.py
          pete_e/application/github_deploy_webhook.py
          pete_e/infrastructure/apple_parser.py
          pete_e/infrastructure/apple_parser_normalization.py
          pete_e/infrastructure/apple_parser_stages.py
          pete_e/infrastructure/apple_parser_types.py
          pete_e/infrastructure/apple_health_ingestor.py
          pete_e/infrastructure/apple_ingest_coordinator.py
          pete_e/infrastructure/plan_persistence.py
          tests/domain/test_weekly_narrative_analysis.py
          tests/domain/test_weekly_narrative_characterization.py
          tests/domain/test_body_age_trend_analysis.py
          tests/domain/test_body_age_trend_characterization.py
          tests/application/test_body_age_trend_consumers.py
          tests/test_github_deploy_webhook.py
          tests/test_github_webhook_contract.py
          tests/test_apple_ingest_adapter_contract.py
          tests/test_apple_ingest_coordinator.py
          tests/test_apple_parser_characterization.py
          tests/test_apple_parser_stages.py
          tests/infrastructure/test_plan_persistence.py
          tests/infrastructure/test_plan_save_mapper_contract.py
          tests/integration/test_plan_persistence_integration.py
          tests/test_plan_persistence_characterization.py

      - name: Check incremental typing boundary
        run: .venv/bin/mypy

      - name: Run unit lane
        run: .venv/bin/python -m pytest -q -m unit

      - name: Run real-framework contract lane
        run: .venv/bin/python -m pytest -q -m contract

      - name: Enforce measured branch-coverage ratchets
        if: matrix.python-version == '3.11'
        run: |
          .venv/bin/coverage erase
          .venv/bin/coverage run -m pytest -q -m "unit or contract"
          .venv/bin/coverage report
          .venv/bin/coverage report --fail-under=100 \
          pete_e/domain/body_age_history.py \
          pete_e/domain/body_age_trend.py
          .venv/bin/coverage report --fail-under=100 pete_e/domain/weekly_narrative.py
          .venv/bin/coverage report --fail-under=100 \
          pete_e/application/github_deploy_webhook.py
          .venv/bin/coverage report --fail-under=100 \
          pete_e/infrastructure/apple_parser.py \
          pete_e/infrastructure/apple_parser_normalization.py \
          pete_e/infrastructure/apple_parser_stages.py \
          pete_e/infrastructure/apple_parser_types.py
          .venv/bin/coverage report --fail-under=100 \
          pete_e/infrastructure/apple_ingest_coordinator.py
          .venv/bin/coverage report --fail-under=100 \
          pete_e/infrastructure/plan_persistence.py

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pete_e_test_ci
          POSTGRES_USER: pete_test
          POSTGRES_PASSWORD: pete_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pete_test -d pete_e_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install the locked dependency graph
        run: |
          uv sync --frozen --no-editable
          .venv/bin/python -m pip check

      - name: Run schema lifecycle migrations first
        env:
          PETEEEBOT_TEST_DATABASE_URL: postgresql://pete_test:pete_test@127.0.0.1:5432/pete_e_test_ci
        run: >-
          .venv/bin/python -m pytest -q -m integration --run-postgres
          tests/integration/test_schema_management_integration.py

      - name: Run application PostgreSQL integration after schema validation
        env:
          PETEEEBOT_TEST_DATABASE_URL: postgresql://pete_test:pete_test@127.0.0.1:5432/pete_e_test_ci
        run: >-
          .venv/bin/python -m pytest -q -m integration --run-postgres
          --ignore=tests/integration/test_schema_management_integration.py

  installed-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install the locked dependency graph
        run: |
          uv sync --frozen --no-editable
          .venv/bin/python -m pip check

      - name: Build and inspect wheel/sdist, then install and smoke the wheel
        run: .venv/bin/python -m pytest -q -m artifact
