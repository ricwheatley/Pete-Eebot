name: CI - Pete-Eebot

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Verify and install the locked dependency graph
        run: |
          uv lock --check
          uv sync --frozen --no-editable
          .venv/bin/python -m pip check

      - name: Audit the locked dependency graph
        run: .venv/bin/python -m pip_audit --local --skip-editable

      - name: Lint critical modules
        run: |
          .venv/bin/ruff check \
            pete_e/api.py \
            pete_e/api_errors.py \
            pete_e/api_security.py \
            pete_e/api_routes \
            pete_e/application/orchestrator.py \
            pete_e/application/plan_generation.py \
            pete_e/application/sync.py \
            pete_e/config/config.py \
            pete_e/infrastructure/postgres_dal.py \
            pete_e/infrastructure/schema_migrations.py \
            pete_e/cli/schema.py \
            pete_e/logging_setup.py \
            tests/conftest.py \
            tests/config/test_settings.py \
            tests/integration/conftest.py \
            tests/integration/test_api_contracts.py \
            tests/integration/test_postgres_integration.py \
            tests/integration/test_schema_management_integration.py \
            tests/postgres_safety.py \
            tests/test_api_cli_commands.py \
            tests/test_dependency_imports.py \
            tests/test_dependency_runtime_smokes.py \
            tests/test_installed_artifact.py \
            tests/test_postgres_safety.py \
            tests/test_tenacity_contract.py

      - name: Run unit lane
        run: .venv/bin/python -m pytest -q -m unit

      - name: Run real-framework contract lane
        run: .venv/bin/python -m pytest -q -m contract

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pete_e_test_ci
          POSTGRES_USER: pete_test
          POSTGRES_PASSWORD: pete_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pete_test -d pete_e_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install the locked dependency graph
        run: |
          uv sync --frozen --no-editable
          .venv/bin/python -m pip check

      - name: Run schema lifecycle migrations first
        env:
          PETEEEBOT_TEST_DATABASE_URL: postgresql://pete_test:pete_test@127.0.0.1:5432/pete_e_test_ci
        run: >-
          .venv/bin/python -m pytest -q -m integration --run-postgres
          tests/integration/test_schema_management_integration.py

      - name: Run application PostgreSQL integration after schema validation
        env:
          PETEEEBOT_TEST_DATABASE_URL: postgresql://pete_test:pete_test@127.0.0.1:5432/pete_e_test_ci
        run: >-
          .venv/bin/python -m pytest -q -m integration --run-postgres
          --ignore=tests/integration/test_schema_management_integration.py

  installed-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install the locked dependency graph
        run: |
          uv sync --frozen --no-editable
          .venv/bin/python -m pip check

      - name: Build, install, and smoke the wheel outside the checkout
        run: .venv/bin/python -m pytest -q -m artifact
