name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: Scan every fetched ref after an approved history rewrite
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check --status
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          chmod 700 "${RUNNER_TEMP}/gitleaks"
          printf 'GITLEAKS_BIN=%s\n' "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_ENV}"

      - name: Verify custom fixtures and candidate tree
        run: python scripts/test_secret_scanner.py

      - name: Scan commits introduced by this event
        if: github.event_name != 'workflow_dispatch' || inputs.full_history != true
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "${zero}" ]]; then
            base="${BEFORE_SHA}"
          else
            base="$(git merge-base origin/main "${CURRENT_SHA}" 2>/dev/null || git rev-parse "${CURRENT_SHA}^")"
          fi

          if [[ "${base}" == "${CURRENT_SHA}" ]]; then
            echo "No new commit range; candidate-tree scan already passed."
            exit 0
          fi

          "${GITLEAKS_BIN}" git --no-banner --redact=100 --config .gitleaks.toml \
            --log-opts="${base}..${CURRENT_SHA}" .

      - name: Scan all fetched refs
        if: github.event_name == 'workflow_dispatch' && inputs.full_history == true
        run: >-
          "${GITLEAKS_BIN}" git --no-banner --redact=100 --config .gitleaks.toml
          --log-opts="--all" .
